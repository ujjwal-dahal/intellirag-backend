[project]
name = "intellirag-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ujjwal-dahal", email = "toppelp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "upstash-redis>=1.9.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
intellirag-backend = "intellirag_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
